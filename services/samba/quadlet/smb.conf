[global]
    server string = samba
    security = user
    server min protocol = SMB2
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    unix extensions = no
    mangled names = no
    unix charset = UTF-8

[media]
    path = /shared
    browseable = yes
    writable = yes
    read only = no
    # Rootless podman maps container root to the host user that owns /srv/media.
    force user = root
    force group = root
    create mask = 0644
    directory mask = 0755
